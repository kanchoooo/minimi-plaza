# 윈도우 빌드: v* 태그가 올라오면 설치파일을 만들어 같은 버전의 "초안" 릴리스에 올린다.
# 맥 빌드·서명·공증은 맥북에서 (npm run release 가 전체 과정을 처리).
name: release-windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - name: Package & upload to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
