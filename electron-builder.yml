# 미니미 광장 패키징 설정
# - 맥: 유니버설(arm64+x64) dmg + zip(자동 업데이트용). 맥북에서 빌드.
#   서명: 키체인의 "Developer ID Application" 인증서 (자동 탐색)
#   공증: 키체인 프로필 APPLE_KEYCHAIN_PROFILE=minimi-notary (xcrun notarytool store-credentials 로 한 번 저장)
# - 윈도우: 서명 없이 NSIS. 파일명 고정(MinimiPlaza-Setup.exe) — 버전을 붙이면 SmartScreen 평판이 초기화된다.
appId: com.minimiplaza.app
# 맥에서 번들/헬퍼 이름이 한글이면 Electron 이 시작 시 크래시 → 파일 이름은 영문, 표시 이름만 한글
productName: MinimiPlaza
copyright: Copyright © 2026 minimi-plaza
directories:
  output: dist
  buildResources: build
electronLanguages: [ko, en]
# 초대 링크로 앱 바로 열기: minimiplaza://join/코드
protocols:
  - name: Minimi Plaza Invite
    schemes: [minimiplaza]
files:
  - out/**
  - package.json
  - '!**/*.map'
mac:
  category: public.app-category.social-networking
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  artifactName: MinimiPlaza-mac.${ext}
  extendInfo:
    # CFBundleName 은 헬퍼 앱 탐색에 쓰이므로 영문 유지
    CFBundleDisplayName: 미니미 광장
    NSHumanReadableCopyright: Copyright © 2026 minimi-plaza
dmg:
  title: 미니미 광장
  artifactName: MinimiPlaza-mac.dmg
  window:
    width: 540
    height: 380
win:
  # 윈도우 실행 파일만 영문 이름 (맥은 헬퍼 앱 이름과 맞아야 해서 productName 그대로)
  executableName: MinimiPlaza
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
  artifactName: MinimiPlaza-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 미니미 광장
  artifactName: MinimiPlaza-Setup.${ext}
  deleteAppDataOnUninstall: false
linux:
  target: AppImage
  artifactName: MinimiPlaza-linux.${ext}
publish:
  # 자동 업데이트·고정 다운로드 주소 (공개 저장소 Releases)
  # 맥(로컬)과 윈도우(GitHub Actions)가 같은 초안 릴리스에 올린 뒤, 둘 다 올라오면 공개한다 (scripts/release.mjs)
  provider: github
  owner: kanchoooo
  repo: minimi-plaza
  releaseType: draft
